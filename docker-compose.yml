services:
  db:
    image: postgres:16-alpine
    container_name: lostfound-java-db
    restart: unless-stopped
    command: postgres -c shared_buffers=96MB -c max_connections=30
    environment:
      POSTGRES_DB: ${DB_NAME:?required}
      POSTGRES_USER: ${DB_USER:?required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/${GH_REPO}:${IMAGE_TAG:-latest}
    container_name: lostfound-java-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: [".env"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db
      DB_PORT: "5432"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65 -XX:+UseSerialGC -Xss512k"
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 600m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  pgdata: